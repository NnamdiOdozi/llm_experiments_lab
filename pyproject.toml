[project]
name = "llm-experiments-lab"
version = "0.1.0"
description = "Browser-based lab for hands-on LLM architecture experiments"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.5.0",
    "torch>=2.2.0",
    "nbformat>=5.10.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "config"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
